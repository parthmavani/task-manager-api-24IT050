# ===============================================================
# Task Management Full-Stack Application - Docker Compose
# Practical 11: Containerization with Docker & Docker Compose
# ===============================================================

services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: task-manager-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  # 2. Node.js / Express Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-manager-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/task-manager
      - JWT_SECRET=secret123
    depends_on:
      - mongodb
    networks:
      - app-network

  # 3. React / Vite Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-manager-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

# Named Volumes (Data Persistence across container restarts)
volumes:
  mongo-data:
    name: task-manager-mongo-data

# Internal Docker Bridge Network for Inter-Container Communication
networks:
  app-network:
    name: task-manager-network
    driver: bridge
